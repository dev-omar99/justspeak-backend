name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-real
      - name: Build
        run: npm run build
